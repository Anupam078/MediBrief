spring.application.name=medibrief-backend
server.port=8080

# AI Service Configuration
# Replace this with the actual ngrok/tunnel URL when starting up
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout.connect=5000
ai.service.timeout.read=120000

# Cache configuration
cache.ttl.seconds=3600

# Input limitations
input.max.length=5000
input.min.length=50
